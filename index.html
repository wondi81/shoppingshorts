<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘뭐사지? - 전체 상품</title>
<link rel="stylesheet" href="/style.css"></head>
<body><div class="wrap">
<header class="site"><div class="logo">오늘뭐사지?</div><div class="sub">영상에서 본 상품, 번호로 찾아보세요</div></header>
<input id="search" type="text" placeholder="상품명 검색">
<div id="list"><a class="card" href="/1/"><span class="num">1번</span><div class="name">[테스트] 딩동펫 반려동물 급수식기</div></a></div>
<script>
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  document.querySelectorAll('#list .card').forEach(c => {
    c.style.display = c.querySelector('.name').textContent.toLowerCase().includes(q) ? '' : 'none';
  });
});
</script>
</div></body></html>
