<script>
const targetLink = 'https://link.coupang.com/a/hspIlpWu0j';
const intentUrl = 'intent://link.coupang.com/a/hspIlpWu0j#Intent;scheme=https;package=com.coupang.mobile;S.browser_fallback_url=https://link.coupang.com/a/hspIlpWu0j;end';
const isAndroid = /Android/i.test(navigator.userAgent);
let redirected = false;

function goToCoupang() {
  if (redirected) return;
  redirected = true;
  if (isAndroid) {
    window.location.href = intentUrl;
  } else {
    window.location.href = targetLink;
  }
}

function handleCoupangClick(event, intent) {

}

// 1.5초 프로그레스바 및 자동 리다이렉트 (BIZ INDEX 4.73 적용)

  const bar = document.getElementById('progress');

  }
  setTimeout(goToCoupang, 1500);
});

// 오늘 자정까지 카운트다운 타이머
function updateTimer() {
  const now = new Date();
  const midnight = new Date();
  midnight.setHours(23, 59, 59, 999);
  const diff = Math.max(0, midnight - now);

  const hours = Math.floor(diff / (1000 * 60 * 60));
  const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
  const seconds = Math.floor((diff % (1000 * 60)) / 1000);

  const timerEl = document.getElementById('deadline-timer');
  if (timerEl) {
    const timeStr = String(hours).padStart(2, '0') + ':' + String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
    timerEl.textContent = '⏰ 오늘 특가 마감까지 ' + timeStr;
  }
}

updateTimer();
setInterval(updateTimer, 1000);
